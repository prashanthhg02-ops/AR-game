<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101523">
  <title>Pocket Portal — AR Treasure Hunt</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f7f8ff;
      background: #101523;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --panel: rgba(15, 20, 34, .78);
      --muted: #b6bfd5;
      --mint: #78f3d0;
      --violet: #a78bfa;
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }

    body {
      background:
        radial-gradient(ellipse at 50% 95%, rgba(86, 74, 173, .35), transparent 52%),
        linear-gradient(160deg, #18243a 0%, #101523 60%, #17142a 100%);
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: manipulation;
    }

    .hud {
      position: fixed;
      z-index: 2;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(18px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom));
      pointer-events: none;
    }

    .topbar, .bottom-panel, .controls, .badge, button { pointer-events: auto; }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      max-width: 70%;
      padding: 14px 16px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      background: var(--panel);
      backdrop-filter: blur(16px);
      box-shadow: 0 12px 35px rgba(0,0,0,.2);
    }

    .eyebrow {
      margin: 0 0 3px;
      color: var(--mint);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(18px, 5vw, 23px); letter-spacing: -.04em; }

    .score {
      min-width: 82px;
      padding: 12px 15px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 18px;
      background: var(--panel);
      text-align: center;
      backdrop-filter: blur(16px);
    }

    .score strong { display: block; color: var(--mint); font-size: 23px; line-height: 1.1; }
    .score span { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }

    .bottom-panel {
      align-self: center;
      width: min(100%, 440px);
      padding: 16px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 22px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: 0 16px 45px rgba(0,0,0,.3);
    }

    #message {
      min-height: 38px;
      margin: 0 0 13px;
      color: #e4e9f8;
      font-size: 13px;
      line-height: 1.45;
    }

    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }

    button {
      min-height: 48px;
      padding: 0 13px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 14px;
      color: white;
      background: rgba(255,255,255,.08);
      font: inherit;
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease, background .15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:active { transform: scale(.97); }
    button:disabled { opacity: .42; cursor: not-allowed; }

    .primary {
      border-color: transparent;
      color: #101523;
      background: linear-gradient(120deg, var(--mint), #a8f6e5);
      box-shadow: 0 7px 22px rgba(120,243,208,.2);
    }

    .badge {
      position: fixed;
      z-index: 2;
      top: max(106px, calc(env(safe-area-inset-top) + 88px));
      left: 50%;
      max-width: calc(100% - 36px);
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      color: #d7def0;
      background: rgba(15,20,34,.64);
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      transform: translateX(-50%);
      backdrop-filter: blur(12px);
    }

    @media (max-width: 370px) {
      .brand { padding: 12px; }
      .bottom-panel { padding: 13px; }
      button { padding: 0 8px; font-size: 12px; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="hud">
    <header class="topbar">
      <div class="brand">
        <p class="eyebrow">A tiny world, nearby</p>
        <h1>Pocket Portal</h1>
      </div>
      <div class="score" aria-label="Collected crystals">
        <strong id="score">0/5</strong>
        <span>Crystals</span>
      </div>
    </header>
    <section class="bottom-panel" aria-live="polite">
      <p id="message">Find a little magic around you. Start AR to place your treasure hunt.</p>
      <div class="controls">
        <button id="ar-button" class="primary">Start AR</button>
        <button id="practice-button">Practice mode</button>
        <button id="place-button" disabled>Place game</button>
        <button id="reset-button" disabled>New hunt</button>
      </div>
    </section>
  </div>
  <div class="badge" id="badge">Use a phone with AR support for the full experience</div>

  <script type="module">
    import * as THREE from "three";

    const message = document.querySelector("#message");
    const badge = document.querySelector("#badge");
    const scoreLabel = document.querySelector("#score");
    const arButton = document.querySelector("#ar-button");
    const practiceButton = document.querySelector("#practice-button");
    const placeButton = document.querySelector("#place-button");
    const resetButton = document.querySelector("#reset-button");

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 30);
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.prepend(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xdce9ff, 0x372b64, 2.2));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
    keyLight.position.set(1, 3, 2);
    scene.add(keyLight);

    const reticle = new THREE.Mesh(
      new THREE.RingGeometry(0.12, 0.16, 40),
      new THREE.MeshBasicMaterial({ color: 0x78f3d0, side: THREE.DoubleSide })
    );
    reticle.rotation.x = -Math.PI / 2;
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    const arena = new THREE.Group();
    arena.visible = false;
    scene.add(arena);
    const crystals = [];
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const hitMatrix = new THREE.Matrix4();
    let hitTestSource = null;
    let lastHit = false;
    let activeMode = "idle";
    let collected = 0;
    let startedAt = 0;
    let gameOver = false;
    let practiceOrbit = false;

    const crystalColors = [0x78f3d0, 0xa78bfa, 0xffc978, 0x78b8ff, 0xff85bf];
    const crystalSpots = [
      [-0.48, 0.36, -0.15],
      [0.48, 0.56, -0.12],
      [-0.22, 0.72, 0.48],
      [0.40, 0.34, 0.52],
      [0.02, 0.95, -0.62]
    ];

    function setMessage(text) {
      message.textContent = text;
    }

    function updateScore() {
      scoreLabel.textContent = `${collected}/${crystals.length || 5}`;
    }

    function makeCrystal(color, index) {
      const group = new THREE.Group();
      const material = new THREE.MeshStandardMaterial({
        color,
        emissive: color,
        emissiveIntensity: 1.4,
        metalness: 0.12,
        roughness: 0.2
      });
      const gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.095, 0), material);
      group.add(gem);

      const halo = new THREE.Mesh(
        new THREE.TorusGeometry(0.15, 0.009, 8, 36),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.8 })
      );
      halo.rotation.x = Math.PI / 2;
      group.add(halo);

      const light = new THREE.PointLight(color, 1.2, 1.1);
      group.add(light);
      group.position.set(...crystalSpots[index]);
      group.userData = { gem, halo, baseY: group.position.y, phase: index * 1.3, collected: false };
      return group;
    }

    function clearArena() {
      for (const crystal of crystals) {
        arena.remove(crystal);
        crystal.traverse((object) => {
          if (object.geometry) object.geometry.dispose();
          if (object.material) {
            for (const material of Array.isArray(object.material) ? object.material : [object.material]) material.dispose();
          }
        });
      }
      crystals.length = 0;
      for (const child of [...arena.children]) {
        arena.remove(child);
        if (child.geometry) child.geometry.dispose();
        if (child.material) child.material.dispose();
      }
      arena.visible = false;
      collected = 0;
      gameOver = false;
      updateScore();
    }

    function buildArena() {
      clearArena();
      const floorRing = new THREE.Mesh(
        new THREE.RingGeometry(0.75, 0.79, 64),
        new THREE.MeshBasicMaterial({ color: 0x78f3d0, transparent: true, opacity: 0.55, side: THREE.DoubleSide })
      );
      floorRing.rotation.x = -Math.PI / 2;
      floorRing.position.y = 0.015;
      arena.add(floorRing);

      const center = new THREE.Mesh(
        new THREE.CircleGeometry(0.74, 64),
        new THREE.MeshBasicMaterial({ color: 0x78f3d0, transparent: true, opacity: 0.07, side: THREE.DoubleSide })
      );
      center.rotation.x = -Math.PI / 2;
      center.position.y = 0.012;
      arena.add(center);

      crystalColors.forEach((color, index) => {
        const crystal = makeCrystal(color, index);
        arena.add(crystal);
        crystals.push(crystal);
      });
      arena.visible = true;
      updateScore();
      startedAt = performance.now();
      gameOver = false;
      placeButton.disabled = true;
      resetButton.disabled = false;
      setMessage(activeMode === "practice"
        ? "Tap the floating crystals to collect them all."
        : "Walk toward the crystals or tap one to collect it. Watch your step!");
    }

    function collectCrystal(crystal) {
      if (!crystal || crystal.userData.collected || gameOver) return;
      crystal.userData.collected = true;
      crystal.visible = false;
      collected += 1;
      updateScore();
      if (collected === crystals.length) {
        gameOver = true;
        const seconds = Math.max(1, Math.round((performance.now() - startedAt) / 1000));
        setMessage(`Portal complete! You found every crystal in ${seconds} seconds. Start a new hunt?`);
      } else {
        setMessage(`${crystals.length - collected} ${crystals.length - collected === 1 ? "crystal" : "crystals"} left. Keep exploring!`);
      }
    }

    async function startAR() {
      if (!navigator.xr) {
        setMessage("WebXR isn't available here. Try Practice mode, or open this page on a supported AR phone over HTTPS.");
        return;
      }
      try {
        const supported = await navigator.xr.isSessionSupported("immersive-ar");
        if (!supported) {
          setMessage("This device doesn't support immersive AR. Practice mode is ready to play.");
          return;
        }
        const session = await navigator.xr.requestSession("immersive-ar", {
          requiredFeatures: ["hit-test"],
          optionalFeatures: ["dom-overlay"],
          domOverlay: { root: document.body }
        });
        await renderer.xr.setSession(session);
        activeMode = "ar";
        practiceOrbit = false;
        scene.background = null;
        clearArena();
        reticle.visible = false;
        hitTestSource = null;
        lastHit = false;
        placeButton.disabled = true;
        resetButton.disabled = true;
        badge.textContent = "Move your phone slowly to find a surface";
        setMessage("Move your phone slowly to scan a floor or table. Then place your portal.");

        const viewerSpace = await session.requestReferenceSpace("viewer");
        hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
        session.addEventListener("end", () => {
          hitTestSource = null;
          reticle.visible = false;
          arena.visible = false;
          activeMode = "idle";
          placeButton.disabled = true;
          resetButton.disabled = true;
          badge.textContent = "Use a phone with AR support for the full experience";
          setMessage("AR session ended. Start another hunt whenever you're ready.");
        }, { once: true });
      } catch (error) {
        setMessage(`Couldn't start AR: ${error.message || "check camera and motion permissions, then try again."}`);
      }
    }

    function startPractice() {
      activeMode = "practice";
      practiceOrbit = true;
      scene.background = new THREE.Color(0x101523);
      clearArena();
      arena.position.set(0, -0.15, -2.45);
      arena.quaternion.identity();
      arena.scale.setScalar(1);
      buildArena();
      placeButton.disabled = true;
      resetButton.disabled = false;
      badge.textContent = "Practice mode · tap each crystal";
      setMessage("Practice mode: tap the floating crystals to collect them all.");
    }

    function placeArena() {
      if (!lastHit || activeMode !== "ar") return;
      arena.matrix.copy(hitMatrix);
      arena.matrix.decompose(arena.position, arena.quaternion, arena.scale);
      buildArena();
    }

    function resetHunt() {
      if (activeMode === "ar") {
        if (lastHit) placeArena();
        else setMessage("Scan a floor or table to find a new place for your portal.");
      } else if (activeMode === "practice") {
        startPractice();
      }
    }

    arButton.addEventListener("click", startAR);
    practiceButton.addEventListener("click", startPractice);
    placeButton.addEventListener("click", placeArena);
    resetButton.addEventListener("click", resetHunt);

    renderer.domElement.addEventListener("pointerdown", (event) => {
      if (!arena.visible || gameOver || !crystals.length) return;
      const bounds = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - bounds.left) / bounds.width) * 2 - 1;
      pointer.y = -((event.clientY - bounds.top) / bounds.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const targets = [];
      for (const crystal of crystals) {
        if (!crystal.userData.collected) crystal.traverse((object) => {
          if (object.isMesh) targets.push(object);
        });
      }
      const hit = raycaster.intersectObjects(targets, false)[0];
      if (hit) {
        let parent = hit.object;
        while (parent && parent !== arena && !Object.hasOwn(parent.userData, "collected")) parent = parent.parent;
        if (parent && parent !== arena) collectCrystal(parent);
      }
    });

    function animate(time, frame) {
      if (frame && hitTestSource) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const results = frame.getHitTestResults(hitTestSource);
        if (results.length && referenceSpace) {
          const pose = results[0].getPose(referenceSpace);
          if (pose) {
            hitMatrix.fromArray(pose.transform.matrix);
            reticle.matrix.copy(hitMatrix);
            reticle.visible = true;
            lastHit = true;
            placeButton.disabled = activeMode !== "ar";
            if (!arena.visible) setMessage("Surface found. Tap Place game to open your portal.");
          }
        } else {
          reticle.visible = false;
          lastHit = false;
          placeButton.disabled = true;
        }
      }

      if (arena.visible && !gameOver) {
        for (const crystal of crystals) {
          if (crystal.userData.collected) continue;
          const { gem, halo, baseY, phase } = crystal.userData;
          const elapsed = time / 1000;
          crystal.position.y = baseY + Math.sin(elapsed * 2.2 + phase) * 0.045;
          gem.rotation.y = elapsed * 1.3 + phase;
          gem.rotation.x = Math.sin(elapsed + phase) * 0.16;
          halo.rotation.z = elapsed * 0.55 + phase;
        }
        if (activeMode === "ar") {
          const playerPosition = renderer.xr.getCamera().getWorldPosition(new THREE.Vector3());
          for (const crystal of crystals) {
            if (crystal.userData.collected || !crystal.visible) continue;
            const crystalPosition = crystal.getWorldPosition(new THREE.Vector3());
            if (playerPosition.distanceTo(crystalPosition) < 0.48) collectCrystal(crystal);
          }
        } else if (practiceOrbit) {
          camera.lookAt(0, 0.25, -2.45);
        }
      }
      renderer.render(scene, camera);
    }

    renderer.setAnimationLoop(animate);

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    if (!window.isSecureContext && location.hostname !== "localhost") {
      arButton.disabled = true;
      badge.textContent = "AR needs HTTPS · Practice mode works here";
      setMessage("For AR, host this page on HTTPS and open it on a WebXR-compatible phone. Practice mode works now.");
    } else if (navigator.xr) {
      navigator.xr.isSessionSupported("immersive-ar").then((supported) => {
        badge.textContent = supported
          ? "AR ready · scan a flat surface to begin"
          : "AR unavailable on this device · try Practice mode";
      }).catch(() => {
        badge.textContent = "AR support could not be checked · try Practice mode";
      });
    }
  </script>
</body>
</html>
